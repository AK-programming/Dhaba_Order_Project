# Dhaba Orders - Redis configuration
bind 0.0.0.0
protected-mode no
port 6379

# Data directory (mount the persistent volume here)
dir /data

# Append-only file so queued jobs survive restarts
appendonly yes
appendfsync everysec

# Snapshots as a secondary safety net
save 900 1
save 300 10
save 60 10000

# The same instance holds the job queue and stats, so never evict keys.
# allkeys-lru would silently drop queued orders under memory pressure.
maxmemory-policy noeviction

loglevel notice
