apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - namespace.yaml
  - ../../base

images:
  - name: 940482421289.dkr.ecr.eu-north-1.amazonaws.com/dhaba-visionary-rebel/web
    newTag: bf39c2f0570b2ab90805229d1d4888b515bd7219
  - name: 940482421289.dkr.ecr.eu-north-1.amazonaws.com/dhaba-visionary-rebel/menu-api
    newTag: bf39c2f0570b2ab90805229d1d4888b515bd7219
  - name: 940482421289.dkr.ecr.eu-north-1.amazonaws.com/dhaba-visionary-rebel/orders-api
    newTag: bf39c2f0570b2ab90805229d1d4888b515bd7219
  - name: 940482421289.dkr.ecr.eu-north-1.amazonaws.com/dhaba-visionary-rebel/kitchen-worker
    newTag: bf39c2f0570b2ab90805229d1d4888b515bd7219
  - name: 940482421289.dkr.ecr.eu-north-1.amazonaws.com/dhaba-visionary-rebel/stats-api
    newTag: bf39c2f0570b2ab90805229d1d4888b515bd7219

patches:
  - target:
      version: v1
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 80
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: dhaba
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.visionaryrebels.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.visionaryrebels.com
  - target:
      version: v1
      kind: ConfigMap
      name: dhaba-config
    patch: |-
      - op: replace
        path: /data/APP_VERSION
        value: bf39c2f0570b2ab90805229d1d4888b515bd7219
      - op: replace
        path: /data/NGINX_SERVICE_DOMAIN
        value: .staging.svc.cluster.local
