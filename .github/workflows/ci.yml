name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  menu-api:
    name: Menu API lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menu-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: menu-api/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest -q

  orders-api:
    name: Orders API format, vet, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: orders-api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  kitchen-worker:
    name: Kitchen worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitchen-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode test

  stats-api:
    name: Stats API PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, pdo_sqlite
          tools: composer:v2
      - name: Check PHP syntax
        run: find stats-api/overlay -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare Laravel test application
        run: |
          composer create-project laravel/laravel:^13.0 stats-api/ci-app \
            --no-interaction --prefer-dist --no-progress
          cd stats-api/ci-app
          composer require predis/predis:^2.2 --no-interaction --no-progress
          rm -f tests/Feature/ExampleTest.php
          cp -R ../overlay/. .
          touch database/database.sqlite
          php artisan key:generate --force
      - name: Run PHPUnit tests
        working-directory: stats-api/ci-app
        run: php artisan test

  dockerfiles-and-shell:
    name: Dockerfile and shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        run: |
          while IFS= read -r dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$dockerfile"
          done < <(find . -name Dockerfile -not -path './.git/*' -print)
      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  build-and-push:
    name: Build, scan, and push changed images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web
      - menu-api
      - orders-api
      - kitchen-worker
      - stats-api
      - dockerfiles-and-shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find changed services
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA=$(git hash-object -t tree /dev/null)
          fi

          services=()
          for service in web menu-api orders-api kitchen-worker stats-api postgres redis; do
            if ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- "$service/"; then
              services+=("$service")
            fi
          done

          if [[ -d scripts/monitor ]] &&
             ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- ops-monitor/ scripts/monitor/; then
            services+=(ops-monitor)
          fi

          services_json=$(jq -cn --args '$ARGS.positional' "${services[@]}")
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          echo "Changed services: ${services[*]:-none}"
      - name: Configure AWS credentials with OIDC
        if: steps.changed.outputs.services != '[]'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and push images
        if: steps.changed.outputs.services != '[]'
        env:
          TEAM: ${{ vars.TEAM }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SERVICES_JSON: ${{ steps.changed.outputs.services }}
          GIT_SHA: ${{ github.sha }}
        run: |
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          mapfile -t services < <(jq -r '.[]' <<< "$SERVICES_JSON")
          AWS_ACCOUNT="$AWS_ACCOUNT" scripts/build-and-push.sh "${services[@]}"
      - name: Wait for ECR scans and reject critical findings
        if: steps.changed.outputs.services != '[]'
        env:
          TEAM: ${{ vars.TEAM }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT: ${{ vars.AWS_ACCOUNT }}
          SERVICES_JSON: ${{ steps.changed.outputs.services }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [[ -z "$AWS_ACCOUNT" ]]; then
            AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          fi

          while IFS= read -r service; do
            repository="dhaba-${TEAM}/${service}"
            echo "Waiting for scan: ${repository}:${IMAGE_TAG}"
            aws ecr wait image-scan-complete \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-id "imageTag=${IMAGE_TAG}"

            findings=$(aws ecr describe-image-scan-findings \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-id "imageTag=${IMAGE_TAG}")
            status=$(jq -r '.imageScanStatus.status // empty' <<< "$findings")
            if [[ "$status" != "COMPLETE" ]]; then
              echo "Image scan did not complete for ${repository}:${IMAGE_TAG} (status: ${status:-unknown})" >&2
              exit 1
            fi

            critical=$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<< "$findings")
            echo "${repository}:${IMAGE_TAG} critical findings: ${critical}"
            if (( critical > 0 )); then
              echo "Critical ECR findings block this image." >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")
