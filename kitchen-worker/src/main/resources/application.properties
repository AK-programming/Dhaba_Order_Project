# kitchen-worker configuration
spring.application.name=kitchen-worker

# Postgres (JDBC URL, not the postgres:// form used by the other services)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/dhaba}
spring.datasource.username=${DB_USER:dhaba}
spring.datasource.password=${DB_PASSWORD:dhaba}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# Redis
spring.data.redis.url=${REDIS_URL:redis://redis:6379}

app.version=${APP_VERSION:dev}
# Time an order spends in "cooking" before it becomes "ready"
app.cook-millis=${COOK_MILLIS:5000}

# Background worker: no web server, no web port
spring.main.web-application-type=none

logging.level.com.dhaba=INFO
