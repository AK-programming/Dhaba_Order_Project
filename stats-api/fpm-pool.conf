[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; Local only: Nginx in the same container talks to PHP-FPM here.
listen = 127.0.0.1:9001

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep the container's environment variables (APP_KEY, REDIS_HOST, APP_VERSION) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
